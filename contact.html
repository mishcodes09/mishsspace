<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

    <style>
        .container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-top: 100px;
        }

        .section-text {
            display: block;
            margin-left: 140px;
        }

        .section-text h1 {
            font-size: 50px;
            padding-bottom: 5px;
            font-weight: bold;
            margin: 0;
        }

        .looking {
            padding-left: 5px;
        }

        .section-text h2 {
            margin: 0;
            font-weight: bold;
            font-size: 20px;
            padding-top: 30px;
            padding-bottom: 5px;
            padding-left: 5px;
        }

        .section-text p {
            margin: 0;
            font-size: 15px;
            padding-left: 5px;
        }

        .form-section {
            display: flex;
            margin-right: 300px;
        }

        form {
            width: 300px;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
        }

        .form-group.message-group {
            flex-direction: column;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        #message {
            width: 200px;
            height: 150px;
        }

        #first-name {
            width: 200px;
        }

        #last-name {
            width: 200px;
        }

        #email {
            width: 200px;
        }

        #subject{
            width: 200px;
        }

        .send-button {
            margin-left: 30px;
            width: 150px; /* Adjust the size as needed */
            height: 150px; /* Adjust the size as needed */
            border-radius: 50%; /* Makes the button circular */
            background-color: #FF9900; /* Button background color */
            color: black; /* Text color */
            border: none; /* Remove default border */
            font-size: 16px; /* Adjust font size as needed */
            display: flex; /* Center the text */
            align-items: center; /* Center the text vertically */
            justify-content: center; /* Center the text horizontally */
            cursor: pointer; /* Change cursor to pointer on hover */
            transition: background-color 0.3s ease; /* Smooth transition for background color */
            border: 1px solid black; /* Add a border (3px solid black) */
            font-weight: bold;
        }

        .send-button:hover {
            background-color: white;
            color: black;
        }

        .container-flex {
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html"><div class="logo"></div></a>

            <a class="hover" href="index.html">
                <div class="name-title">
                    <span class="name">mishscodes</span></a>
                </div>
            </a>
        </div>

        <ul class="navbar-right">
            <li><a href="resume.html">Resume</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="section-text">
            <h1>Contact</h1>
            <p class="looking">Looking forward to hearing from you</p>

            <h2>Email</h2>
            <p>mishssmicrosoft@gmail.com</p>
        </div>

        <div class="form-section">
            <form action="#" method="post">
                <div class="form-group">
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                </div>
                <div class="form-group">
                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                </div>
                <div class="form-group message-group">
                    <label for="message">Message</label>
                    <div class="container-flex">
                        <div class="message-send-container">
                            <textarea id="message" name="message" required></textarea>
                        </div>
    
                        <div class="send-container">
                            <button type="submit" class="send-button">Send</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <section>
        <div class="footer-basic">
            <footer>
                <div class="social">
                    <a href="#"><i class="icon ion-social-instagram"></i></a>
                    <a href="#"><i class="icon ion-social-github"></i></a>
                    <a href="#"><i class="icon ion-social-linkedin"></i></a>
                </div>
    
                <ul class="list-inline">
                    <li class="list-inline-item"><a href="index.html">Home</a></li>
                    <li class="list-inline-item"><a href="resume.html">Resume</a></li>
                    <li class="list-inline-item"><a href="projects.html">Projects</a></li>
                    <li class="list-inline-item"><a href="contact.html">Contact</a></li>
                </ul>
                <p class="copyright">mishcodes © 2024</p>
            </footer>
        </div>
    </section>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
